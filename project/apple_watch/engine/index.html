<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>KROZO render</title>
<style>
@font-face { font-family: Plex; font-weight: 400; src: url(fonts/plex-400.woff2) format("woff2"); }
@font-face { font-family: Plex; font-weight: 500; src: url(fonts/plex-500.woff2) format("woff2"); }
@font-face { font-family: Plex; font-weight: 700; src: url(fonts/plex-700.woff2) format("woff2"); }
@font-face { font-family: PlexLatin; font-weight: 500; src: url(fonts/plex-latin-500.woff2) format("woff2"); }
@font-face { font-family: PlexLatin; font-weight: 700; src: url(fonts/plex-latin-700.woff2) format("woff2"); }
:root {
  --bg: #080B12; --blue: #168BFF; --cyan: #59C7FF; --ink: #F4F7FB; --gray: #A7B1C2;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; background: var(--bg); overflow: hidden; }
body { font-family: Plex, PlexLatin, sans-serif; color: var(--ink); }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
canvas#bg { position: absolute; inset: 0; }
.layer { position: absolute; inset: 0; }
/* brand bug */
#bug { position: absolute; top: 96px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px;
  align-items: center; font-family: PlexLatin; font-weight: 700; letter-spacing: 10px; font-size: 26px;
  color: var(--gray); direction: ltr; }
#bug i { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 12px var(--blue); }
#bug span.t { font-weight: 500; letter-spacing: 6px; font-size: 20px; opacity: .8; }
/* captions (top) */
#subs { position: absolute; left: 90px; right: 90px; top: 1290px; text-align: center; direction: rtl; }
#subs .line { display: inline; font-size: 58px; line-height: 1.55; font-weight: 700;
  color: var(--ink); text-shadow: 0 2px 18px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.9); }
#subs .w { color: rgba(244,247,251,.5); }
#subs .w.on { color: var(--ink); }
#subs .w.now { color: var(--cyan); }
/* 3D overlays: readings, leader labels, notes */
#ov { position: absolute; inset: 0; pointer-events: none; }
#ov .num { position: absolute; transform: translate(-50%,-50%); font-family: PlexLatin; font-weight: 500; font-size: 34px; color: var(--gray); letter-spacing: 1px; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
#ov .num.on { color: var(--cyan); font-weight: 700; font-size: 42px; text-shadow: 0 0 18px rgba(89,199,255,.8), 0 2px 10px rgba(0,0,0,.9); }
#ov .num.g { font-size: 30px; background: rgba(8,11,18,.55); padding: 2px 10px; border-radius: 8px; }
#ov .num.g.on { font-size: 36px; background: rgba(22,139,255,.25); }
#ov svg.ld { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: visible; }
#ov svg.ld line { stroke: rgba(244,247,251,.75); stroke-width: 2.5; }
#ov svg.ld circle { fill: var(--cyan); }
#ov .tag { position: absolute; transform: translate(-50%,-50%); font-weight: 700; font-size: 38px; color: var(--ink); white-space: nowrap;
  background: rgba(8,11,18,.82); border: 2px solid rgba(167,177,194,.5); border-radius: 14px; padding: 8px 22px; }
#ov .tag.hot { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 24px rgba(89,199,255,.35); }
#ov .tag.warn { border-color: var(--gray); color: var(--ink); }
#ov .ring { position: absolute; width: 300px; height: 300px; border: 4px solid var(--cyan); border-radius: 50%; box-shadow: 0 0 30px rgba(89,199,255,.6), inset 0 0 30px rgba(89,199,255,.3); }
#ov .note { position: absolute; left: 60px; bottom: 120px; font-size: 26px; font-weight: 500; color: rgba(167,177,194,.75); }
/* AirTag overlays */
#ov .km { position: absolute; left: 0; right: 0; top: 1470px; text-align: center; font-size: 76px; font-weight: 700; color: var(--ink); text-shadow: 0 0 30px rgba(22,139,255,.6), 0 4px 18px rgba(0,0,0,.9); }
#ov .km .latin { color: var(--cyan); }
#ov .dim { position: absolute; height: 0; border-top: 3px solid var(--cyan); text-align: center; }
#ov .dim::before, #ov .dim::after { content: ''; position: absolute; top: -14px; width: 3px; height: 26px; background: var(--cyan); }
#ov .dim::before { left: 0; } #ov .dim::after { right: 0; }
#ov .dim span { position: relative; top: 14px; font-size: 44px; font-weight: 700; color: var(--ink); }
#ov .ticks { position: absolute; left: 190px; right: 190px; top: 1640px; display: flex; justify-content: space-between; }
#ov .ticks i { width: 22px; height: 22px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 14px var(--cyan); }
#ov .coord { position: absolute; left: 0; right: 0; top: 1460px; text-align: center; font-size: 46px; font-weight: 700; color: var(--cyan); text-shadow: 0 0 24px rgba(89,199,255,.6), 0 2px 12px rgba(0,0,0,.9); }
#ov .coord small { display: block; font-size: 32px; color: var(--gray); font-weight: 500; margin-top: 8px; }
#ov .card { position: absolute; left: 110px; right: 110px; top: 1300px; padding: 30px 36px; border-radius: 28px; background: rgba(8,11,18,.9); border: 2px solid var(--blue); box-shadow: 0 0 40px rgba(22,139,255,.35); }
#ov .card .ct { font-size: 40px; font-weight: 700; color: var(--ink); }
#ov .card .cx { font-size: 38px; font-weight: 500; color: var(--cyan); margin-top: 14px; letter-spacing: 2px; text-align: left; }
#ov .card .cs { font-size: 30px; color: var(--gray); margin-top: 14px; min-height: 40px; }
/* callouts */
.badge { display: inline-block; padding: 14px 36px; border-radius: 999px; font-weight: 700; font-size: 50px; background: rgba(8,11,18,.86); box-shadow: 0 10px 40px rgba(0,0,0,.45); }
.badge.yes { color: var(--cyan); border: 2.5px solid var(--cyan); box-shadow: 0 0 34px rgba(89,199,255,.35), 0 10px 40px rgba(0,0,0,.45); }
.badge.no { color: var(--gray); border: 2.5px solid rgba(167,177,194,.55); }
.xmark { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 7px solid var(--gray); display: flex; align-items: center; justify-content: center; color: var(--ink); font-size: 66px; font-weight: 700; opacity: 0; background: rgba(8,11,18,.6); }
.kick { font-size: 40px; font-weight: 700; color: var(--cyan); letter-spacing: 6px; }
.chip { padding: 10px 26px; border-radius: 16px; background: rgba(8,11,18,.85); border: 2px solid rgba(167,177,194,.5); color: var(--ink); }
.chip.na { border-color: var(--blue); color: #7fbfff; } .chip.cl { border-color: var(--cyan); color: var(--cyan); }
.meter { position: absolute; left: 150px; right: 150px; top: 1440px; padding: 26px 34px; border-radius: 26px; background: rgba(8,11,18,.88); border: 2px solid #2A3446; }
.meter .bar { position: relative; height: 26px; margin-top: 18px; border-radius: 13px; background: #1a2130; }
.meter .f { position: absolute; right: 0; top: 0; bottom: 0; border-radius: 13px; background: var(--gray); width: 0; }
.meter .th { position: absolute; right: 62%; top: -10px; bottom: -10px; width: 5px; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
/* Apple Watch overlays */
#ov .clock, .clock { position: absolute; left: 0; right: 0; top: 1520px; text-align: center; font-size: 110px; font-weight: 700; color: var(--ink); text-shadow: 0 0 30px rgba(22,139,255,.6), 0 4px 18px rgba(0,0,0,.9); }
.clock small { display: block; font-size: 38px; color: var(--cyan); font-weight: 500; }
.slow { position: absolute; left: 80px; right: 80px; top: 1600px; text-align: center; font-size: 38px; font-weight: 700; color: var(--ink); background: rgba(8,11,18,.82); border: 2px solid rgba(59,255,138,.55); border-radius: 18px; padding: 16px 20px; }
.pill { position: absolute; left: 0; right: 0; top: 1610px; margin: auto; width: max-content; font-size: 44px; font-weight: 700; color: var(--ink); background: rgba(8,11,18,.86); border: 2.5px solid rgba(167,177,194,.55); border-radius: 999px; padding: 14px 36px; }
.chips { position: absolute; left: 0; right: 0; top: 1610px; display: flex; justify-content: center; gap: 22px; }
.cchip { display: inline-flex; align-items: center; gap: 14px; font-size: 44px; font-weight: 700; color: var(--ink); background: rgba(8,11,18,.88); border: 3px solid; border-radius: 999px; padding: 12px 30px; }
.cchip i { width: 26px; height: 26px; border-radius: 50%; }
.meter2 { position: absolute; left: 130px; right: 130px; top: 1600px; padding: 22px 34px 28px; border-radius: 26px; background: rgba(8,11,18,.9); border: 2px solid #2A3446; }
.meter2 .ml { font-size: 36px; font-weight: 700; color: var(--ink); text-align: center; }
.meter2 .bar { position: relative; height: 28px; margin-top: 18px; border-radius: 14px; background: #1a2130; overflow: hidden; }
.meter2 .f { position: absolute; right: 0; top: 0; bottom: 0; border-radius: 14px; background: linear-gradient(270deg, var(--blue), var(--cyan)); box-shadow: 0 0 18px rgba(89,199,255,.6); }
.scope { position: absolute; left: 60px; right: 60px; top: 1500px; height: 360px; border-radius: 28px; background: rgba(8,11,18,.88); border: 2px solid rgba(22,139,255,.6); box-shadow: 0 0 40px rgba(22,139,255,.25); }
.scope.sm { top: 1620px; height: 230px; }
.scope .sl { position: absolute; right: 30px; top: 18px; font-size: 34px; font-weight: 700; color: var(--gray); }
.mon .pk { position: absolute; transform: translate(-50%,-50%); width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--cyan); background: rgba(8,11,18,.85); color: var(--ink); font-family: PlexLatin; font-weight: 700; font-size: 38px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(89,199,255,.5); }
.mon .cnt, .mon .rate { position: absolute; left: 0; right: 0; top: 250px; text-align: center; }
.mon b { display: block; font-size: 230px; line-height: 1; color: var(--ink); text-shadow: 0 0 40px rgba(22,139,255,.7); }
.mon small { display: block; font-size: 50px; font-weight: 700; color: var(--cyan); margin-top: 10px; }
.mon .timer { width: 640px; height: 16px; margin: 0 auto 14px; border-radius: 8px; background: #1a2130; overflow: hidden; }
.mon .timer div { height: 100%; background: linear-gradient(90deg, var(--blue), var(--cyan)); }
.mon .tl { font-size: 38px; color: var(--gray); margin-bottom: 20px; font-weight: 500; }
/* progress */
#prog { position: absolute; left: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, var(--blue), var(--cyan)); }
/* generic text elements used by scenes */
.kicker { font-weight: 500; color: var(--cyan); font-size: 34px; letter-spacing: 1px; }
.headline { font-weight: 700; font-size: 92px; line-height: 1.25; color: var(--ink); }
.sub { font-weight: 400; font-size: 40px; color: var(--gray); line-height: 1.5; }
.hl { color: var(--blue); }
.label { position: absolute; font-weight: 500; font-size: 34px; color: var(--ink);
  background: rgba(8,11,18,.78); border: 1.5px solid rgba(22,139,255,.55); border-radius: 14px; padding: 10px 22px; white-space: nowrap; }
.label.c { color: var(--cyan); }
.latin { font-family: PlexLatin; direction: ltr; unicode-bidi: isolate; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <canvas id="gl" width="1080" height="1920" style="position:absolute;inset:0;opacity:0"></canvas>
  <div id="ov"></div>
  <div id="scenes" class="layer"></div>
  <div id="flash" style="position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(244,247,251,.9),rgba(89,199,255,.55) 35%,rgba(22,139,255,0) 75%)"></div>
  <div id="subband" style="position:absolute;left:0;right:0;top:1180px;height:480px;background:linear-gradient(180deg,rgba(8,11,18,0),rgba(8,11,18,.62) 35%,rgba(8,11,18,.62) 65%,rgba(8,11,18,0))"></div>
  <div id="bug"><span>KROZO</span><i></i><span class="t">BEYOND TECH</span></div>
  <div id="subs"></div>
  <div id="prog"></div>
</div>
<script src="engine.js"></script>
<script src="brand.js"></script>

<script src="subs.js"></script>
<script src="warp.js"></script>
<script src="xsec.js"></script>
<script src="timeline.js"></script>
<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/jsm/"}}</script>
<script type="module" src="watch3d.js"></script>
</body>
</html>
